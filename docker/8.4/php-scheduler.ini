; Loaded only by the scheduler's cron runs (PHP_INI_SCAN_DIR in the crontab), and inherited
; by the commands it starts. opcache is off for CLI by default, so every run recompiled the
; framework; the file cache keeps compiled code between runs, checked against file timestamps.
opcache.enable_cli=1
opcache.file_cache=/tmp/opcache-cli
opcache.validate_timestamps=1
