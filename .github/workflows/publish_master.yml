name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  group: deploy-release
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/m3u-editor
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Validate release before building
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      proxy_commit: ${{ steps.proxy.outputs.commit }}
    steps:
      - name: Determine release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          if ! echo "$INPUT_TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid release tag: '$INPUT_TAG'"
            exit 1
          fi
          echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT

      # Fails if the tag does not exist
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Resolve commit and verify version
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          SHA=$(git rev-parse HEAD)
          # Remove 'v' prefix if present for Docker tags
          VERSION="${TAG#v}"
          CONFIG_VERSION=$(grep -oP "^\s*'version'\s*=>\s*'\K[^']+" config/dev.php)
          if [ "$CONFIG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match config/dev.php version '$CONFIG_VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION ($SHA)"

      - name: Get m3u-proxy latest commit
        id: proxy
        run: |
          PROXY_COMMIT=$(git ls-remote https://github.com/${{ github.repository_owner }}/m3u-proxy.git refs/heads/master | cut -f1)
          if ! echo "$PROXY_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve m3u-proxy master to a commit SHA (got: '$PROXY_COMMIT')"
            exit 1
          fi
          echo "commit=$PROXY_COMMIT" >> $GITHUB_OUTPUT
          echo "📦 m3u-proxy commit: $PROXY_COMMIT"

  # Run CI against the exact commit being released
  ci-check:
    name: CI Validation
    needs: [validate]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
    secrets: inherit

  release-amd64:
    name: Build & Push (amd64)
    runs-on: ubuntu-latest
    needs: [validate, ci-check]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for amd64
        id: meta-amd64
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.tag }},suffix=-amd64
            type=raw,value=latest,suffix=-amd64

      - name: Build and push amd64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-amd64.outputs.tags }}
          labels: ${{ steps.meta-amd64.outputs.labels }}
          build-args: |
            GIT_BRANCH=master
            GIT_COMMIT=${{ needs.validate.outputs.sha }}
            GIT_TAG=${{ needs.validate.outputs.tag }}
            M3U_PROXY_REPO=https://github.com/${{ github.repository_owner }}/m3u-proxy.git
            M3U_PROXY_BRANCH=master
            M3U_PROXY_COMMIT=${{ needs.validate.outputs.proxy_commit }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,mode=max,scope=release-amd64
          provenance: false
          sbom: false

  release-arm64:
    name: Build & Push (arm64)
    runs-on: ubuntu-22.04-arm
    needs: [validate, ci-check]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for arm64
        id: meta-arm64
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.tag }},suffix=-arm64
            type=raw,value=latest,suffix=-arm64

      - name: Build and push arm64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-arm64.outputs.tags }}
          labels: ${{ steps.meta-arm64.outputs.labels }}
          build-args: |
            GIT_BRANCH=master
            GIT_COMMIT=${{ needs.validate.outputs.sha }}
            GIT_TAG=${{ needs.validate.outputs.tag }}
            M3U_PROXY_REPO=https://github.com/${{ github.repository_owner }}/m3u-proxy.git
            M3U_PROXY_BRANCH=master
            M3U_PROXY_COMMIT=${{ needs.validate.outputs.proxy_commit }}
          cache-from: type=gha,scope=release-arm64
          cache-to: type=gha,mode=max,scope=release-arm64
          provenance: false
          sbom: false

  push-manifest:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: [validate, release-amd64, release-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Reference the exact digests built above rather than the per-arch tags
      - name: Create and push version and latest manifests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:${{ needs.validate.outputs.version }} \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            ${{ env.REGISTRY_IMAGE }}@${{ needs.release-amd64.outputs.digest }} \
            ${{ env.REGISTRY_IMAGE }}@${{ needs.release-arm64.outputs.digest }}

      - name: Inspect manifests
        run: |
          echo "=== Version Manifest ==="
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ needs.validate.outputs.version }}
          echo ""
          echo "=== Latest Manifest ==="
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:latest

  notify-success:
    name: Release Complete
    runs-on: ubuntu-latest
    needs: [validate, push-manifest]
    steps:
      - name: Release summary
        run: |
          echo "## 🚀 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ needs.validate.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY_IMAGE }}:${{ needs.validate.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [validate, ci-check, release-amd64, release-arm64, push-manifest]
    if: failure()
    steps:
      - name: Report failure
        run: |
          echo "::error::Release deployment failed!"
          echo "## ❌ Release Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
